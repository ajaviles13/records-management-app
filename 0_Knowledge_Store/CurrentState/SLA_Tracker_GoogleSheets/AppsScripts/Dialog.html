<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: 'Google Sans', Arial, sans-serif;
        padding: 20px;
        margin: 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #333;
      }
      
      .container {
        background: white;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      }
      
      h2 {
        margin: 0 0 25px 0;
        color: #667eea;
        font-size: 24px;
        font-weight: 600;
        text-align: center;
      }
      
      .form-group {
        margin-bottom: 20px;
      }
      
      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: #555;
        font-size: 14px;
      }
      
      input[type="text"],
      select {
        width: 100%;
        padding: 12px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        box-sizing: border-box;
        transition: all 0.3s ease;
      }
      
      input[type="text"]:focus,
      select:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }
      
      .radio-group {
        display: flex;
        gap: 20px;
        margin-top: 8px;
      }
      
      .radio-option {
        flex: 1;
      }
      
      .radio-option input[type="radio"] {
        display: none;
      }
      
      .radio-option label {
        display: block;
        padding: 12px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: 500;
        color: #555;
      }
      
      .radio-option input[type="radio"]:checked + label {
        background: #667eea;
        border-color: #667eea;
        color: white;
      }
      
      .radio-option label:hover {
        border-color: #667eea;
        background: #f5f7ff;
      }
      
      .radio-option input[type="radio"]:checked + label:hover {
        background: #5568d3;
      }
      
      .button-group {
        display: flex;
        gap: 10px;
        margin-top: 30px;
      }
      
      button {
        flex: 1;
        padding: 14px 24px;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      
      .submit-btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }
      
      .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }
      
      .submit-btn:disabled {
        background: #ccc;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }
      
      .cancel-btn {
        background: #f5f5f5;
        color: #666;
      }
      
      .cancel-btn:hover {
        background: #e0e0e0;
      }
      
      .loading {
        display: none;
        text-align: center;
        margin-top: 20px;
      }
      
      .spinner {
        border: 3px solid #f3f3f3;
        border-top: 3px solid #667eea;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .required {
        color: #e74c3c;
      }
      
      .progress-message {
        font-size: 16px;
        color: #667eea;
        font-weight: 600;
        margin-top: 15px;
      }
      
      .not-found-list {
        max-height: 300px;
        overflow-y: auto;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        padding: 15px;
        margin: 20px 0;
      }
      
      .not-found-item {
        padding: 10px;
        background: #fff5f7;
        border: 1px solid #f5576c;
        border-radius: 6px;
        margin-bottom: 8px;
        font-size: 14px;
      }
      
      /* Received Files Report Styles */
      .report-subheader {
        text-align: center;
        color: #666;
        font-size: 15px;
        margin-bottom: 20px;
        line-height: 1.6;
      }
      
      .folder-path-section {
        background: #f8f9fa;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 20px;
      }
      
      .folder-path-label {
        font-weight: 600;
        color: #555;
        font-size: 13px;
        margin-bottom: 8px;
      }
      
      .folder-path-value {
        color: #333;
        font-size: 14px;
        word-break: break-all;
        font-family: 'Courier New', monospace;
      }
      
      .files-list {
        max-height: 350px;
        overflow-y: auto;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 20px;
      }
      
      .file-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
        margin-bottom: 10px;
        background: #fafafa;
      }
      
      .file-tag {
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        white-space: nowrap;
      }
      
      .file-tag.new {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      
      .file-tag.overwritten {
        background: #d1ecf1;
        color: #0c5460;
        border: 1px solid #bee5eb;
      }
      
      .file-tag.not-found {
        background: #fff3cd;
        color: #856404;
        border: 1px solid #ffeaa7;
      }
      
      .file-name {
        flex: 1;
        color: #333;
        font-size: 14px;
        word-break: break-word;
      }
      
      .close-btn {
        width: 100%;
        padding: 14px 24px;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        transition: all 0.3s ease;
      }
      
      .close-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>📂 Egnyte File Extraction</h2>
      
      <form id="extractionForm">
        <div class="form-group">
          <label for="directLink">
            Direct Link <span class="required">*</span>
          </label>
          <input 
            type="text" 
            id="directLink" 
            placeholder="https://auratrans.egnyte.com/navigate/folder/3698537e-265f-406f-bef1-fcb80971e794"
            required
          >
        </div>
        
        <div class="form-group">
          <label>
            Received or Delivered? <span class="required">*</span>
          </label>
          <div class="radio-group">
            <div class="radio-option">
              <input type="radio" id="received" name="deliveryType" value="Received">
              <label for="received">📥 Received</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="delivered" name="deliveryType" value="Delivered">
              <label for="delivered">📤 Delivered</label>
            </div>
          </div>
        </div>
        
        <div class="form-group">
          <label for="destinationTab">
            Destination Tab <span class="required">*</span>
          </label>
          <select id="destinationTab" required>
            <option value="">Loading...</option>
          </select>
        </div>
        
        <div class="button-group">
          <button type="button" class="cancel-btn" onclick="google.script.host.close()">
            Cancel
          </button>
          <button type="submit" class="submit-btn" id="submitBtn">
            Extract Files
          </button>
        </div>
      </form>
      
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p id="loadingMessage">Processing...</p>
      </div>
    </div>

    <script>
      let currentSheetName = null;
      
      // Load sheet info (current sheet + all sheets) in ONE call for instant loading
      google.script.run
        .withSuccessHandler(function(sheetInfo) {
          currentSheetName = sheetInfo.currentSheetName;
          populateSheetNames(sheetInfo.allSheetNames);
        })
        .withFailureHandler(showError)
        .getSheetInfo();
      
      function populateSheetNames(sheetNames) {
        const select = document.getElementById('destinationTab');
        // Clear loading option
        select.innerHTML = '';
        
        // Add "Current tab" option first and select it
        if (currentSheetName) {
          const currentOption = document.createElement('option');
          currentOption.value = currentSheetName;
          currentOption.textContent = `Current tab - "${currentSheetName}"`;
          currentOption.selected = true;
          select.appendChild(currentOption);
        }
        
        // Add all other sheet names
        sheetNames.forEach(name => {
          const option = document.createElement('option');
          option.value = name;
          option.textContent = name;
          select.appendChild(option);
        });
      }
      
      // Handle form submission
      document.getElementById('extractionForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const directLink = document.getElementById('directLink').value.trim();
        const deliveryType = document.querySelector('input[name="deliveryType"]:checked');
        const destinationTab = document.getElementById('destinationTab').value;
        
        // Validate
        if (!directLink) {
          alert('Please enter a Direct Link');
          return;
        }
        
        if (!deliveryType) {
          alert('Please select Received or Delivered');
          return;
        }
        
        if (!destinationTab) {
          alert('Please select a Destination Tab');
          return;
        }
        
        // Show loading
        document.getElementById('extractionForm').style.display = 'none';
        document.getElementById('loading').style.display = 'block';
        
        // Call server function
        google.script.run
          .withSuccessHandler(handleSuccess)
          .withFailureHandler(handleError)
          .processEgnyteExtraction(directLink, deliveryType.value, destinationTab);
      });
      
      function handleSuccess(result) {
        if (result.success) {
          // Check if we need to show received files report
          if (result.showReceivedReport) {
            showReceivedReport(result);
            return;
          }
          
          // Check if we need to show delivered flag not set report
          if (result.showDeliveredFlagNotSetReport) {
            showDeliveredFlagNotSetReport(result);
            return;
          }
          
          // Check if we need to show delivered progress
          if (result.showDeliveredProgress) {
            showDeliveredProgressDialog(result);
            return;
          }
          
          // Check if we need to show duplicate dialog (Received mode)
          if (result.showDuplicateDialog) {
            try {
              showDuplicatesUI(result);
            } catch (error) {
              console.error('ERROR in showDuplicatesUI:', error);
              alert('Error showing duplicates UI: ' + error.message);
            }
            return;
          }
          
          // Normal success - show toast and close
          document.getElementById('loading').style.display = 'none';
          google.script.run.showToast(result.message);
          setTimeout(() => {
            google.script.host.close();
          }, 1000);
        } else {
          // Show error
          document.getElementById('loading').style.display = 'none';
          document.getElementById('extractionForm').style.display = 'block';
          alert(result.message);
        }
      }
      
      function showDeliveredProgressDialog(data) {
        // Update loading message with counts
        const skippedText = data.totalSkipped > 0 
          ? ` and skipping ${data.totalSkipped} file(s) with "QA Delivery by" blank` 
          : '';
        
        document.getElementById('loadingMessage').innerHTML = 
          `<div class="progress-message">Searching for ${data.totalToFind} file(s) with "QA Delivery by" set${skippedText}...<br>This may take a moment</div>`;
        
        // Execute the search
        google.script.run
          .withSuccessHandler(handleDeliveredSearchComplete)
          .withFailureHandler(handleDeliveredSearchError)
          .executeDeliveredSearch(data.folderId, data.searchListData, data.destinationTab, data.startTime);
      }
      
      function handleDeliveredSearchComplete(result) {
        document.getElementById('loading').style.display = 'none';
        
        if (result.success) {
          // Check if we need to show delivered files report
          if (result.showDeliveredReport) {
            showDeliveredReport(result);
            return;
          }
          
          // Fallback - show success and close (shouldn't normally reach here)
          google.script.run.showToast(result.message || 'Success!');
          setTimeout(() => {
            google.script.host.close();
          }, 1000);
        } else {
          // Error occurred
          if (result.partialSuccess) {
            google.script.run.showToast(result.message);
            setTimeout(() => {
              google.script.host.close();
            }, 2000);
          } else {
            alert(result.message);
            document.getElementById('extractionForm').style.display = 'block';
          }
        }
      }
      
      function handleDeliveredSearchError(error) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('extractionForm').style.display = 'block';
        alert('Error during search: ' + error.message);
      }
      
      
      function showDuplicatesUI(data) {
        // Hide main form, show duplicates in same dialog
        document.getElementById('extractionForm').style.display = 'none';
        document.getElementById('loading').style.display = 'none';
        
        // Build duplicate UI
        const container = document.querySelector('.container');
        container.innerHTML = `
          <h2 style="color: #f5576c;">⚠️ Duplicate Files Found</h2>
          <p style="text-align: center; color: #666; margin-bottom: 20px; font-size: 14px;">
            The following files already exist with received timestamps.
          </p>
          
          <div style="padding: 12px; background: #f8f9fa; border-radius: 8px; margin-bottom: 15px;">
            <div style="display: flex; align-items: center; gap: 10px; cursor: pointer;" onclick="toggleSelectAll()">
              <input type="checkbox" id="selectAll" checked style="width: 18px; height: 18px; cursor: pointer;">
              <label for="selectAll" style="font-weight: 600; color: #333; cursor: pointer; margin: 0;">
                Select All / Deselect All
              </label>
            </div>
          </div>
          
          <div id="duplicateFileList" style="flex: 1; overflow-y: auto; max-height: 300px; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-bottom: 20px;">
          </div>
          
          <div style="display: flex; gap: 10px;">
            <button onclick="google.script.host.close()" style="flex: 1; padding: 14px 24px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; background: #f5f5f5; color: #666;">
              Cancel
            </button>
            <button id="overwriteBtn" onclick="processDuplicates()" style="flex: 1; padding: 14px 24px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white;">
              Overwrite - 0 Files
            </button>
          </div>
          
          <div id="processingDuplicates" style="display: none; text-align: center; margin-top: 20px;">
            <div style="border: 3px solid #f3f3f3; border-top: 3px solid #f5576c; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto;"></div>
            <p>Processing...</p>
          </div>
        `;
        
        // Store data globally
        window.duplicateData = {
          duplicates: data.duplicates,
          allFilesData: data.allFilesData,
          folderPath: data.folderPath,
          destinationTab: data.destinationTab
        };
        
        // Populate file list
        const fileList = document.getElementById('duplicateFileList');
        
        if (!fileList) {
          console.error('ERROR: duplicateFileList element not found!');
          alert('ERROR: Could not find file list container');
          return;
        }
        
        data.duplicates.forEach((dup, idx) => {
          const fileItem = document.createElement('div');
          fileItem.className = 'duplicate-file-item';
          fileItem.style.cssText = 'padding: 15px; border: 2px solid #f5576c; border-radius: 8px; margin-bottom: 12px; background: #fff5f7;';
          
          fileItem.innerHTML = `
            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 10px;">
              <input type="checkbox" id="dup-${idx}" data-filename="${dup.fileName}" checked style="width: 18px; height: 18px; cursor: pointer;">
              <label for="dup-${idx}" style="font-weight: 600; color: #333; font-size: 15px; flex: 1; cursor: pointer;">
                ${dup.fileName}
              </label>
            </div>
            <div style="font-size: 12px; color: #666; margin-left: 30px; line-height: 1.6;">
              <div><span style="font-weight: 600; color: #555;">Current Timestamp:</span> ${dup.currentDate} ${dup.currentTime} (EST)</div>
              <div><span style="font-weight: 600; color: #555;">Extract Timestamp:</span> ${dup.extractDate} ${dup.extractTime} (EST)</div>
            </div>
          `;
          
          fileList.appendChild(fileItem);
          
          // Add checkbox listener
          const checkbox = fileItem.querySelector('input[type="checkbox"]');
          checkbox.addEventListener('change', function() {
            if (this.checked) {
              fileItem.style.border = '2px solid #f5576c';
              fileItem.style.background = '#fff5f7';
            } else {
              fileItem.style.border = '2px solid #e0e0e0';
              fileItem.style.background = '#ffffff';
            }
            updateDuplicateButton();
          });
        });
        
        updateDuplicateButton();
      }
      
      function toggleSelectAll() {
        const selectAll = document.getElementById('selectAll');
        const checkboxes = document.querySelectorAll('#duplicateFileList input[type="checkbox"]');
        const fileItems = document.querySelectorAll('#duplicateFileList .duplicate-file-item');
        
        checkboxes.forEach((cb, idx) => {
          cb.checked = selectAll.checked;
          const fileItem = fileItems[idx];
          
          if (cb.checked) {
            fileItem.style.border = '2px solid #f5576c';
            fileItem.style.background = '#fff5f7';
          } else {
            fileItem.style.border = '2px solid #e0e0e0';
            fileItem.style.background = '#ffffff';
          }
        });
        
        updateDuplicateButton();
      }
      
      function updateDuplicateButton() {
        const checkboxes = document.querySelectorAll('#duplicateFileList input[type="checkbox"]');
        const checkedCount = Array.from(checkboxes).filter(cb => cb.checked).length;
        const btn = document.getElementById('overwriteBtn');
        btn.textContent = `Overwrite - ${checkedCount} File${checkedCount !== 1 ? 's' : ''}`;
        btn.disabled = checkedCount === 0;
        btn.style.opacity = checkedCount === 0 ? '0.5' : '1';
      }
      
      function processDuplicates() {
        const checkboxes = document.querySelectorAll('#duplicateFileList input[type="checkbox"]:checked');
        const selectedFileNames = Array.from(checkboxes).map(cb => cb.dataset.filename);
        
        if (selectedFileNames.length === 0) {
          alert('Please select at least one file to overwrite');
          return;
        }
        
        // Show loading
        document.querySelector('.container > div').style.display = 'none';
        document.getElementById('processingDuplicates').style.display = 'block';
        
        // Process - allFilesData is already a JSON string
        google.script.run
          .withSuccessHandler((result) => {
            if (result.success) {
              // Show received files report instead of just closing
              if (result.showReceivedReport) {
                showReceivedReport(result);
              } else {
                google.script.run.showToast(result.message);
                setTimeout(() => google.script.host.close(), 1000);
              }
            } else {
              alert(result.message);
              document.getElementById('processingDuplicates').style.display = 'none';
              document.querySelector('.container > div').style.display = 'block';
            }
          })
          .withFailureHandler((error) => {
            alert('Error: ' + error.message);
            document.getElementById('processingDuplicates').style.display = 'none';
            document.querySelector('.container > div').style.display = 'block';
          })
          .processReceivedWithOverwrite(selectedFileNames, window.duplicateData.allFilesData, window.duplicateData.folderPath, window.duplicateData.destinationTab);
      }
      
      function showReceivedReport(result) {
        // Hide loading
        document.getElementById('loading').style.display = 'none';
        
        // Build the report UI
        const container = document.querySelector('.container');
        const totalFiles = result.totalFiles || (result.newFiles.length + result.overwrittenFiles.length);
        
        container.innerHTML = `
          <h2 style="color: #667eea;">📋 Received Files Report - ${totalFiles} File${totalFiles !== 1 ? 's' : ''} Imported</h2>
          
          <div class="report-subheader">
            <div>${result.newFiles.length} NEW file${result.newFiles.length !== 1 ? 's' : ''}</div>
            <div>${result.overwrittenFiles.length} file${result.overwrittenFiles.length !== 1 ? 's' : ''} Overwritten</div>
            <div style="color: #667eea; font-weight: 600;">⏱️ Execution Time: ${result.executionTime}s</div>
          </div>
          
          <div class="folder-path-section">
            <div class="folder-path-label">📁 Source Folder Path:</div>
            <div class="folder-path-value">${result.folderPath || 'N/A'}</div>
          </div>
          
          <div class="files-list" id="filesList">
            ${generateFileListHTML(result.newFiles, result.overwrittenFiles)}
          </div>
          
          <button class="close-btn" onclick="google.script.host.close()">
            Close
          </button>
        `;
      }
      
      function generateFileListHTML(newFiles, overwrittenFiles) {
        let html = '';
        
        // Add new files first
        newFiles.forEach(fileName => {
          html += `
            <div class="file-item">
              <span class="file-tag new">New</span>
              <span class="file-name">${fileName}</span>
            </div>
          `;
        });
        
        // Then add overwritten files
        overwrittenFiles.forEach(fileName => {
          html += `
            <div class="file-item">
              <span class="file-tag overwritten">Overwritten</span>
              <span class="file-name">${fileName}</span>
            </div>
          `;
        });
        
        return html;
      }
      
      function showDeliveredReport(result) {
        // Hide loading
        document.getElementById('loading').style.display = 'none';
        
        // Build the report UI
        const container = document.querySelector('.container');
        const totalFiles = result.totalFiles || result.updatedFiles.length;
        
        container.innerHTML = `
          <h2 style="color: #667eea;">📋 Delivered Files Report - ${totalFiles} File${totalFiles !== 1 ? 's' : ''} Updated</h2>
          
          <div class="report-subheader">
            <div>${result.updatedFiles.length} file${result.updatedFiles.length !== 1 ? 's' : ''} Updated</div>
            <div>${result.notFoundFiles.length} file${result.notFoundFiles.length !== 1 ? 's' : ''} Not Found</div>
            <div style="color: #667eea; font-weight: 600;">⏱️ Execution Time: ${result.executionTime}s</div>
          </div>
          
          <div class="folder-path-section">
            <div class="folder-path-label">📁 Source Folder Path:</div>
            <div class="folder-path-value">${result.folderPath || 'N/A'}</div>
          </div>
          
          <div class="files-list" id="filesList">
            ${generateDeliveredFileListHTML(result.updatedFiles, result.notFoundFiles)}
          </div>
          
          <button class="close-btn" onclick="google.script.host.close()">
            Close
          </button>
        `;
      }
      
      function generateDeliveredFileListHTML(updatedFiles, notFoundFiles) {
        let html = '';
        
        // Add updated files first (green tag)
        updatedFiles.forEach(fileName => {
          html += `
            <div class="file-item">
              <span class="file-tag new">Updated</span>
              <span class="file-name">${fileName}</span>
            </div>
          `;
        });
        
        // Then add not found files (orange tag)
        notFoundFiles.forEach(fileName => {
          html += `
            <div class="file-item">
              <span class="file-tag not-found">Not Found</span>
              <span class="file-name">${fileName}</span>
            </div>
          `;
        });
        
        return html;
      }
      
      function showDeliveredFlagNotSetReport(result) {
        // Hide loading
        document.getElementById('loading').style.display = 'none';
        
        // Build the report UI for flag not set scenario
        const container = document.querySelector('.container');
        const fileCount = result.flagNotSetFiles.length;
        
        container.innerHTML = `
          <h2 style="color: #667eea;">📋 Delivered Files Report - No Files Updated</h2>
          
          <div class="report-subheader">
            <div>${fileCount} file${fileCount !== 1 ? 's' : ''} don't have Delivered Timestamps and don't have their "QA Delivery by" column set</div>
          </div>
          
          <div class="folder-path-section">
            <div class="folder-path-label">📁 Source Folder Path:</div>
            <div class="folder-path-value">${result.folderPath || 'N/A'}</div>
          </div>
          
          <div class="files-list" id="filesList">
            ${generateFlagNotSetFileListHTML(result.flagNotSetFiles)}
          </div>
          
          <button class="close-btn" onclick="google.script.host.close()">
            Close
          </button>
        `;
      }
      
      function generateFlagNotSetFileListHTML(flagNotSetFiles) {
        let html = '';
        
        // Add all files with orange "Flag Not Set" tag
        flagNotSetFiles.forEach(fileName => {
          html += `
            <div class="file-item">
              <span class="file-tag not-found">Flag Not Set</span>
              <span class="file-name">${fileName}</span>
            </div>
          `;
        });
        
        return html;
      }
      
      function handleError(error) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('extractionForm').style.display = 'block';
        alert('Error: ' + error.message);
      }
      
      function showError(error) {
        alert('Failed to load sheet information: ' + error.message);
      }
    </script>
  </body>
</html>
